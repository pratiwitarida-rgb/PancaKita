<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Indra - Menu Belajar</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ===== RUANG INDRA — CUSTOM (di dalam content-box) ===== */

  /* Tabs pilih indra */
  .senses-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 22px;
  }

  .sense-tab {
    font-family: 'Baloo 2', cursive;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 50px;
    border: 3px solid #FFD93D;
    background: #fff;
    color: #7A5C00;
    cursor: pointer;
    box-shadow: 0 4px 0 #E8B92E;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .sense-tab:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #E8B92E; }
  .sense-tab.active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.15);
    color: #fff;
  }

  /* Variasi warna per tab */
  .sense-tab[data-sense="mata"]    { border-color: #74B9FF; box-shadow: 0 4px 0 #2E7DD1; color: #1F5D9E; }
  .sense-tab[data-sense="mata"]:hover { box-shadow: 0 6px 0 #2E7DD1; }
  .sense-tab[data-sense="mata"].active { background: linear-gradient(180deg, #74B9FF, #0984E3); box-shadow: 0 2px 0 #0A5AA0; }

  .sense-tab[data-sense="telinga"] { border-color: #FF9F43; box-shadow: 0 4px 0 #E17E20; color: #A85700; }
  .sense-tab[data-sense="telinga"]:hover { box-shadow: 0 6px 0 #E17E20; }
  .sense-tab[data-sense="telinga"].active { background: linear-gradient(180deg, #FFB347, #FF8C00); box-shadow: 0 2px 0 #A85A00; }

  .sense-tab[data-sense="hidung"]  { border-color: #1DD1A1; box-shadow: 0 4px 0 #10A37F; color: #0B7A5E; }
  .sense-tab[data-sense="hidung"]:hover { box-shadow: 0 6px 0 #10A37F; }
  .sense-tab[data-sense="hidung"].active { background: linear-gradient(180deg, #55EFC4, #00B894); box-shadow: 0 2px 0 #0B7A5E; }

  .sense-tab[data-sense="lidah"]   { border-color: #FF6B9D; box-shadow: 0 4px 0 #D64577; color: #A82E5A; }
  .sense-tab[data-sense="lidah"]:hover { box-shadow: 0 6px 0 #D64577; }
  .sense-tab[data-sense="lidah"].active { background: linear-gradient(180deg, #FF9EC4, #FF6B9D); box-shadow: 0 2px 0 #A82E5A; }

  .sense-tab[data-sense="kulit"]   { border-color: #A29BFE; box-shadow: 0 4px 0 #7B72D9; color: #4D46A0; }
  .sense-tab[data-sense="kulit"]:hover { box-shadow: 0 6px 0 #7B72D9; }
  .sense-tab[data-sense="kulit"].active { background: linear-gradient(180deg, #C8B6FF, #A29BFE); box-shadow: 0 2px 0 #4D46A0; }

  /* Judul indra aktif — DI ATAS viewer 3D */
  .sense-title-box {
    text-align: center;
    margin: 4px 0 14px;
    padding: 12px 20px;
    background: #F0F8FF;
    border-left: 6px solid #54A0FF;
    border-radius: 15px;
    transition: background 0.3s, border-color 0.3s;
  }
  .sense-title-box h3 {
    font-family: 'Baloo 2', cursive;
    font-size: 1.3rem;
    color: #2d3436;
    margin: 0;
    line-height: 1.4;
  }
  body[data-sense-active="mata"]    .sense-title-box { background: #F0F8FF; border-left-color: #54A0FF; }
  body[data-sense-active="telinga"] .sense-title-box { background: #FFF9E6; border-left-color: #FF9F43; }
  body[data-sense-active="hidung"]  .sense-title-box { background: #F0FFF4; border-left-color: #1DD1A1; }
  body[data-sense-active="lidah"]   .sense-title-box { background: #FFF0F6; border-left-color: #FF6B9D; }
  body[data-sense-active="kulit"]   .sense-title-box { background: #F3F0FF; border-left-color: #A29BFE; }

  /* Viewer 3D */
  .viewer-3d {
    position: relative;
    background: linear-gradient(180deg, #EAF6FF 0%, #D6ECFF 100%);
    border: 5px solid #74B9FF;
    border-radius: 25px;
    overflow: hidden;
    height: 380px;
    box-shadow: 0 8px 0 rgba(46, 125, 209, 0.4), 0 15px 30px rgba(0,0,0,0.08);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  body[data-sense-active="mata"]    .viewer-3d { border-color: #74B9FF; box-shadow: 0 8px 0 rgba(46,125,209,0.4), 0 15px 30px rgba(0,0,0,0.08); }
  body[data-sense-active="telinga"] .viewer-3d { border-color: #FF9F43; box-shadow: 0 8px 0 rgba(225,126,32,0.4), 0 15px 30px rgba(0,0,0,0.08); }
  body[data-sense-active="hidung"]  .viewer-3d { border-color: #1DD1A1; box-shadow: 0 8px 0 rgba(16,163,127,0.4), 0 15px 30px rgba(0,0,0,0.08); }
  body[data-sense-active="lidah"]   .viewer-3d { border-color: #FF6B9D; box-shadow: 0 8px 0 rgba(214,69,119,0.4), 0 15px 30px rgba(0,0,0,0.08); }
  body[data-sense-active="kulit"]   .viewer-3d { border-color: #A29BFE; box-shadow: 0 8px 0 rgba(123,114,217,0.4), 0 15px 30px rgba(0,0,0,0.08); }

  #canvas-3d {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
  }
  #canvas-3d:active { cursor: grabbing; }

  .viewer-hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    padding: 5px 14px;
    border-radius: 30px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #555;
    pointer-events: none;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    white-space: nowrap;
  }

  /* Loading indicator */
  .viewer-loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.95);
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: 700;
    color: #555;
    font-size: 0.85rem;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    display: none;
    align-items: center;
    gap: 8px;
  }
  .viewer-loading.show { display: flex; }
  .viewer-loading::before {
    content: "";
    width: 14px; height: 14px;
    border: 3px solid #74B9FF;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Pesan error kalau model gagal dimuat */
  .viewer-error {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 235, 235, 0.98);
    padding: 14px 22px;
    border-radius: 15px;
    font-weight: 700;
    color: #c0392b;
    font-size: 0.85rem;
    text-align: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    display: none;
    max-width: 80%;
    line-height: 1.4;
  }
  .viewer-error.show { display: block; }

  @media (max-width: 700px) {
    .viewer-3d { height: 300px; border-width: 4px; border-radius: 20px; }
    .sense-tab { font-size: 0.78rem; padding: 7px 12px; border-width: 3px; }
    .sense-title-box h3 { font-size: 1.05rem; }
    .sense-title-box { padding: 10px 14px; margin-bottom: 12px; }
    .viewer-hint { font-size: 0.68rem; padding: 4px 10px; }
  }
</style>
</head>
<body data-page="ruang-indra" data-sense-active="mata">

<!-- KONTEN -->
<!-- ============================================ -->
<div class="content-wrapper">
  <div class="content-box">
    <h2 class="page-title">Ruang Indra</h2>

    <p style="text-align:center; margin-bottom: 20px;">
      Jelajahi 5 panca indra manusia dalam bentuk 3D!
      <span class="inline-star img-star-4"></span>
    </p>

    <!-- Tabs pilih indra -->
    <div class="senses-tabs">
      <button class="sense-tab active" data-sense="mata">Mata</button>
      <button class="sense-tab" data-sense="telinga">Telinga</button>
      <button class="sense-tab" data-sense="hidung">Hidung</button>

<!-- Three.js + OrbitControls + GLTFLoader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="script.js"></script>

<script>
/* ==========================================================
   RUANG INDRA — 3D Viewer (Three.js + GLTFLoader)
   ----------------------------------------------------------
   Cara pakai aset 3D sendiri:
   1. Taruh file .glb di folder: assets/models/
   2. Nama file sesuai: mata.glb, telinga.glb, hidung.glb,
      lidah.glb, kulit.glb
   3. Selesai! Model akan otomatis dimuat.
========================================================== */
(function initRuangIndra() {
  const canvas = document.getElementById('canvas-3d');
  if (!canvas) return;
  const wrapper = canvas.parentElement;
  const loadingEl = document.getElementById('viewer-loading');
  const errorEl = document.getElementById('viewer-error');

  /* ---------- Konfigurasi aset ---------- */
  const ASSET_PATH = 'assets/models/';
  const ASSET_EXT = '.glb';

  /* ---------- Scene ---------- */
  const scene = new THREE.Scene();

  /* ---------- Camera ---------- */
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.set(0, 0.5, 5.5);

  /* ---------- Renderer ---------- */
  const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  /* ---------- Lighting ---------- */
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));

  const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  keyLight.position.set(5, 6, 6);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
  fillLight.position.set(-5, -2, 3);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xaaccff, 0.5);
  rimLight.position.set(0, 5, -6);
  scene.add(rimLight);

  /* ---------- OrbitControls ---------- */
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 1.8;
  controls.enablePan = false;
  controls.minDistance = 3;
  controls.maxDistance = 12;

  /* ---------- Info judul ---------- */
  const INFO = {
    mata:    { title: 'Mata — Indra Penglihatan' },
    telinga: { title: 'Telinga — Indra Pendengaran' },
    hidung:  { title: 'Hidung — Indra Penciuman' },
    lidah:   { title: 'Lidah — Indra Pengecap' },
    kulit:   { title: 'Kulit — Indra Peraba' }
  };

  /* ---------- Preset kamera per model ---------- */
  const CAMERA_PRESETS = {
    mata:    { pos: [0, 0.5, 5.5], target: [0, 0, 0] },
    telinga: { pos: [0, 0.3, 5.0], target: [0, 0, 0] },
    hidung:  { pos: [0, 0, 6.0], target: [0, 1.3, 0] },
    lidah:   { pos: [0, 1.8, 5.0], target: [0, 0, 0] },
    kulit:   { pos: [0, 0.3, 5.0], target: [0, 0, 0] }
  };

  /* ==================================================
     LOADER — Custom 3D (.glb)
  ================================================== */
  const loadedModels = {}; // model yang sudah siap dipakai
  const mixers = {};       // animasi mixer per model
  let currentModel = null;
  let pendingName = 'mata';

  const gltfLoader = new THREE.GLTFLoader();

  function showLoading(show) {
    if (loadingEl) loadingEl.classList.toggle('show', !!show);
  }

  function showError(msg) {
    if (!errorEl) return;
    if (msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    } else {
      errorEl.classList.remove('show');
    }
  }

  function loadModel(name) {
    const url = ASSET_PATH + name + ASSET_EXT;

    gltfLoader.load(
      url,
      (gltf) => {
        const model = gltf.scene;

        // Auto-fit ukuran & posisi (skala ~3 unit, terpusat di origin)
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const targetSize = 3;

        model.position.sub(center);
        model.scale.setScalar(targetSize / maxDim);

        // Perbaiki orientasi umum (Blender export sering miring)
        // Uncomment baris di bawah jika model tampak rebah:
        // model.rotation.x = -Math.PI / 2;

        model.traverse(o => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            if (o.material) {
              o.material.side = THREE.FrontSide;
            }
          }
        });

        // Animasi (jika ada)
        if (gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach(clip => mixer.clipAction(clip).play());
          mixers[name] = mixer;
        }

        loadedModels[name] = model;

        // Kalau tab ini yang sedang aktif, langsung tampilkan
        if (pendingName === name) showModel(name);
      },
      undefined,
      (err) => {
        console.error(`[Ruang Indra] Gagal memuat ${url}`, err);
        if (pendingName === name) {
          showLoading(false);
          showError(`⚠️ Model "${name}.glb" tidak ditemukan.\nPastikan file ada di folder: ${ASSET_PATH}`);
        }
      }
    );
  }

  /* ---------- Tampilkan model ---------- */
  function showModel(name) {
    pendingName = name;

    // Update UI tab & judul dulu
    document.getElementById('sense-title').textContent = INFO[name].title;
    document.body.setAttribute('data-sense-active', name);
    document.querySelectorAll('.sense-tab').forEach(t => t.classList.remove('active'));
    const tab = document.querySelector(`.sense-tab[data-sense="${name}"]`);
    if (tab) tab.classList.add('active');

    showError(null);

    // Jika model belum siap, tampilkan loading & tunggu
    if (!loadedModels[name]) {
      showLoading(true);
      loadModel(name);
      return;
    }

    showLoading(false);

    // Ganti model di scene
    if (currentModel) scene.remove(currentModel);
    currentModel = loadedModels[name];
    scene.add(currentModel);

    // Terapkan preset kamera jika ada
    const preset = CAMERA_PRESETS[name];
    if (preset) {
      camera.position.set(preset.pos[0], preset.pos[1], preset.pos[2]);
      controls.target.set(preset.target[0], preset.target[1], preset.target[2]);
      controls.update();
    } else {
      controls.reset();
      camera.position.set(0, 0.5, 5.5);
    }
  }

  /* ---------- Event tab ---------- */
  document.querySelectorAll('.sense-tab').forEach(tab => {
    tab.addEventListener('click', () => showModel(tab.dataset.sense));
  });

  /* ---------- Resize ---------- */
  function resize() {
    const w = wrapper.clientWidth;
    const h = wrapper.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  /* ---------- Animation loop ---------- */
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    Object.values(mixers).forEach(m => m.update(delta));

    controls.update();
    renderer.render(scene, camera);
  }

  /* ---------- Init ---------- */
  resize();
  showModel('mata');
  animate();

})();
</script>

</body>
</html>
